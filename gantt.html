<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ガントチャート - 作業管理システム</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="gantt.css">
</head>
<body>
  <div class="gantt-app">
    <!-- ヘッダー -->
    <header class="gantt-header">
      <div class="gantt-header-left">
        <a href="index.html" class="btn btn-secondary" style="text-decoration:none;">← 戻る</a>
        <h1 class="gantt-title">📊 ガントチャート</h1>
      </div>
      <div class="gantt-header-right">
        <button class="btn btn-secondary" id="todayBtn">今日</button>
        <button class="btn btn-secondary" id="fitAllBtn">全体表示</button>
      </div>
    </header>

    <!-- コントロールバー -->
    <div class="gantt-control-bar">
      <div class="gantt-control-inner">
        <select id="filterAssigneeGantt" class="filter-select">
          <option value="">すべての担当者</option>
        </select>
        <select id="filterStatusGantt" class="filter-select">
          <option value="">すべてのステータス</option>
          <option value="未実施">未実施</option>
          <option value="進行中">進行中</option>
          <option value="保留">保留</option>
          <option value="完了">完了</option>
        </select>
        <div class="zoom-controls">
          <button class="btn btn-secondary zoom-btn" id="zoomOutBtn">ー</button>
          <span class="zoom-label" id="zoomLabel">標準</span>
          <button class="btn btn-secondary zoom-btn" id="zoomInBtn">＋</button>
        </div>
      </div>
    </div>

    <!-- メインエリア -->
    <div class="gantt-main">
      <!-- 左パネル: タスク一覧 -->
      <div class="gantt-task-panel">
        <div class="gantt-panel-header">
          <span id="taskCountLabel">0件</span>
        </div>
        <div class="gantt-panel-search">
          <input type="text" id="ganttSearchInput" class="search-input" placeholder="作業を検索...">
        </div>
        <div class="gantt-panel-list" id="ganttPanelList">
          <!-- タスク行がここに挿入される -->
        </div>
      </div>

      <!-- 右パネル: ガントチャート -->
      <div class="gantt-chart-panel">
        <div class="gantt-scroll" id="ganttScroll">
          <div class="gantt-inner" id="ganttInner">
            <!-- チャート本体がここに挿入される -->
          </div>
        </div>
        <div class="gantt-empty" id="ganttEmpty" style="display:none;">
          <div class="empty-icon">📊</div>
          <p class="empty-text">ガントチャートに表示する工程がありません</p>
          <p class="empty-sub">左パネルの ＋ ボタンから工程を追加してください</p>
        </div>
      </div>
    </div>
  </div>

  <!-- エントリー追加/編集モーダル -->
  <div class="modal-overlay" id="entryFormOverlay">
    <div class="modal modal-gantt-entry">
      <div class="modal-header">
        <h2 class="modal-title" id="entryModalTitle">工程を追加</h2>
        <button class="modal-close" id="entryModalClose">✕</button>
      </div>
      <div class="modal-body">
        <!-- 作業情報（読み取り専用） -->
        <div class="entry-task-info" id="entryTaskInfo"></div>

        <!-- 全体期間 -->
        <div class="form-row form-row-2">
          <div class="form-group">
            <label class="form-label required">開始日</label>
            <input type="date" id="entryStartDate" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label required">終了日 <span style="font-weight:400;color:var(--text-light);">（作業管理の期限と連動）</span></label>
            <input type="date" id="entryEndDate" class="form-input">
          </div>
        </div>

        <!-- メモ -->
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">メモ</label>
            <textarea id="entryNote" class="form-textarea" rows="2" placeholder="ガントチャート用メモ（任意）"></textarea>
          </div>
        </div>

        <!-- 工程セクション -->
        <div class="subtask-section">
          <div class="subtask-section-header">
            <label class="form-label">工程</label>
            <div class="quick-add-btns">
              <button type="button" class="quick-btn" data-name="設計">設計</button>
              <button type="button" class="quick-btn" data-name="実装">実装</button>
              <button type="button" class="quick-btn" data-name="検証">検証</button>
              <button type="button" class="quick-btn" data-name="テスト">テスト</button>
              <button type="button" class="quick-btn" data-name="レビュー">レビュー</button>
              <button type="button" class="quick-btn" data-name="デバッグ">デバッグ</button>
              <button type="button" class="quick-btn" data-name="その他">その他</button>
            </div>
          </div>
          <div id="subtaskRows">
            <!-- 工程行がここに動的追加される -->
          </div>
          <button type="button" class="btn btn-secondary add-subtask-btn" id="addSubtaskBtn">＋ 工程を追加</button>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="entryCancelBtn">キャンセル</button>
          <button type="button" class="btn btn-danger" id="entryDeleteBtn" style="display:none;">削除</button>
          <button type="button" class="btn btn-primary" id="entrySaveBtn">保存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ツールチップ -->
  <div class="gantt-tooltip" id="ganttTooltip"></div>

  <script src="gantt.js"></script>
</body>
</html>
